# ============================================================
# LoongCollector Config Server — Admin mode (distributed)
# Run: ./admin -config config.admin.yaml
#
# Admin mode serves only the management REST API and WebUI.
# It requires MySQL (shared DB) + Redis (shared cache/pubsub).
# Agent heartbeats are handled by the separate configserver binary.
#
# Priority: environment variables > this file > built-in defaults
# ============================================================

# ── Database ─────────────────────────────────────────────────
# Distributed mode requires MySQL or PostgreSQL.
# SQLite is not supported here because multiple processes must share the same database.
database:
  driver: mysql
  # MySQL DSN format:
  #   user:password@tcp(host:port)/dbname?param=value
  # Required params for correctness:
  #   charset=utf8mb4  — full Unicode (emoji, CJK, etc.)
  #   parseTime=True   — map DATETIME → time.Time
  #   loc=Local        — use server local timezone
  dsn: "configserver:s3cr3t@tcp(mysql:3306)/configserver?charset=utf8mb4&parseTime=True&loc=Local"
  # PostgreSQL (16+) example — switch driver to "postgres" and update DSN:
  # driver: postgres
  # dsn: "host=postgres port=5432 user=configserver password=s3cr3t dbname=configserver sslmode=disable TimeZone=UTC"
  # Connection pool (applies to both MySQL and PostgreSQL)
  pool:
    max_open_conns:    25    # max concurrent connections
    max_idle_conns:    10    # idle connections to keep open
    conn_max_lifetime: 3600  # seconds before a connection is recycled
    conn_max_idle_time: 600  # seconds before an idle connection is closed
# ── Redis ─────────────────────────────────────────────────────
# Required in distributed mode for L2 cache and pub/sub
# invalidation between admin and configserver processes.
redis:
  # Standalone / Sentinel mode: single address.
  addr: "redis:6379"
  # Redis Cluster mode: use addrs (YAML list) instead of addr.
  # When addrs contains more than one entry the client automatically
  # operates in cluster mode; the db field is ignored by the cluster.
  # addrs:
  #   - "redis-node1:6379"
  #   - "redis-node2:6379"
  #   - "redis-node3:6379"
  password: ""          # Redis AUTH password; empty = no auth
  db: 0                 # Redis logical database index (0–15); ignored in cluster mode
  # hfe: true           # Hash Field Expiry — requires Valkey 9.0+ or Redis 7.4+.
  #                     # When enabled each config-status field gets its own TTL
  #                     # (HEXPIRE) so stale per-config entries expire independently.

# ── In-process cache (L1 freecache) ──────────────────────────
cache:
  l1_max_size_mb: 100   # Maximum L1 cache size in MiB
  l1_ttl: 5m            # L1 entry TTL
  l2_ttl: 720h          # L2 (Redis) entry TTL (30 days)

# ── Agent API server ──────────────────────────────────────────
# Admin mode does NOT listen for agent connections.
# This section is present for completeness but has no effect
# when running the admin binary.
agent_server:
  host: "0.0.0.0"
  port: 8080

# ── Admin API / WebUI server ──────────────────────────────────
admin_server:
  host: "0.0.0.0"
  port: 8081

# ── Metrics ───────────────────────────────────────────────────
metrics:
  push_url: ""                 # e.g. "http://vmagent:8429/api/v1/import/prometheus"
  push_interval: 30s
  online_window: 5m            # Agents silent longer than this are counted as offline

# ── SMTP (optional) — password-reset emails ─────────────────────
# Leave smtp.host empty to disable email-based password reset.
smtp:
  host: ""                     # SMTP server hostname, e.g. "smtp.example.com"
  port: 587                    # 587 = STARTTLS, 465 = implicit TLS, 25 = plain
  username: ""                 # SMTP auth username
  password: ""                 # SMTP auth password
  from: "noreply@example.com" # Sender address in outgoing emails
  tls: false                   # true = implicit TLS (port 465); false = STARTTLS/plain
  public_url: ""               # Base URL of the admin UI, e.g. "https://admin.example.com"
                               # Used to build the clickable reset link in emails.
