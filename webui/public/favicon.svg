<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a1a2e"/>
  <!-- Dragon silhouette inspired by "Loong" (龙) -->
  <!-- Body arc -->
  <path d="M14 40 Q18 20 32 18 Q46 16 50 30 Q52 38 44 44 Q36 50 28 46 Q20 42 22 34 Q24 26 32 26 Q38 26 40 32"
        stroke="#4f9cf9" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Head -->
  <ellipse cx="50" cy="28" rx="5" ry="4" fill="#4f9cf9" transform="rotate(-20 50 28)"/>
  <!-- Eye -->
  <circle cx="52" cy="26" r="1.2" fill="#fff"/>
  <!-- Horn -->
  <path d="M52 24 L55 20" stroke="#4f9cf9" stroke-width="2" stroke-linecap="round"/>
  <!-- Tail curl -->
  <path d="M22 34 Q14 36 12 44 Q10 50 16 50" stroke="#4f9cf9" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Small flame / data stream dots -->
  <circle cx="20" cy="51" r="1.5" fill="#4f9cf9" opacity="0.8"/>
  <circle cx="26" cy="53" r="1" fill="#4f9cf9" opacity="0.6"/>
  <circle cx="32" cy="54" r="1.2" fill="#4f9cf9" opacity="0.7"/>
</svg>
